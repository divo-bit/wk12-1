<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leo's Yellow Hat - 초등 3학년 영어 이야기 이해 학습</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    body {
      background-color: #f4f7fb;
      color: #222831;
      padding: 20px 14px;
      line-height: 1.6;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* 상단 헤더 */
    .header {
      background: #ffffff;
      border-radius: 20px;
      padding: 18px 22px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-left: 8px solid #ff9f1c;
    }

    .header h1 {
      font-size: 1.32rem;
      color: #1d3557;
      font-weight: 800;
    }

    .header p {
      font-size: 0.9rem;
      color: #6c757d;
      margin-top: 2px;
    }

    .badge {
      background: #fff3cd;
      color: #b45309;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
    }

    /* 상단 3단계 학습 탭 메뉴 */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab-btn {
      background: #ffffff;
      border: 2px solid #dee2e6;
      border-radius: 16px;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 800;
      color: #495057;
      cursor: pointer;
    }

    .tab-btn:hover {
      background: #f8f9fa;
    }

    .tab-btn.active {
      background: #1d3557;
      color: #ffffff;
      border-color: #1d3557;
    }

    /* 메인 콘텐츠 카드 */
    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      display: none;
    }

    .card.active {
      display: block;
    }

    /* [탭 1] 이야기 읽기 스타일 */
    .scene-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .scene-num-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #ced4da;
      background: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      color: #495057;
      cursor: pointer;
    }

    .scene-num-btn.active {
      background: #ff9f1c;
      border-color: #ff9f1c;
      color: #ffffff;
    }

    .scene-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .scene-tag {
      background: #e0fbfc;
      color: #006d77;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
    }

    /* 개별 장면 이미지 표시 영역 (L1 ~ L5) */
    .picture-frame {
      width: 100%;
      height: 300px;
      border-radius: 18px;
      border: 3px solid #dee2e6;
      margin-bottom: 16px;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .picture-frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 12px;
    }

    .error-guide {
      padding: 18px;
      text-align: center;
      font-size: 0.92rem;
      color: #495057;
      line-height: 1.6;
    }

    .story-box {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 18px;
      padding: 20px 18px;
      text-align: center;
      margin-bottom: 18px;
    }

    .en-text {
      font-size: 1.55rem;
      font-weight: 800;
      color: #1d3557;
      margin-bottom: 8px;
      word-break: keep-all;
    }

    .ko-text {
      font-size: 1.1rem;
      color: #495057;
      font-weight: 600;
      padding-top: 10px;
      border-top: 1px dashed #ced4da;
      display: none;
    }

    .ko-text.show {
      display: block;
    }

    .vocab-list {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .vocab-item {
      background: #eef6ff;
      border: 1.5px solid #bdd9ff;
      color: #1e6091;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-meaning {
      background: #ff9f1c;
      color: #ffffff;
    }

    .btn-nav {
      background: #2b2d42;
      color: #ffffff;
    }

    /* [탭 2] 내용 이해 퀴즈 스타일 */
    .quiz-progress {
      font-size: 0.95rem;
      font-weight: 800;
      color: #6c757d;
      margin-bottom: 10px;
    }

    .quiz-question {
      font-size: 1.22rem;
      font-weight: 800;
      color: #1d3557;
      background: #f8f9fa;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      border-left: 6px solid #4ea8de;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      text-align: left;
      background: #ffffff;
      border: 2px solid #dee2e6;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #2b2d42;
      cursor: pointer;
    }

    .option-btn:hover {
      background: #f1f3f5;
    }

    .option-btn.correct {
      background: #d3f9d8;
      border-color: #2b8a3e;
      color: #2b8a3e;
    }

    .option-btn.wrong {
      background: #ffe3e3;
      border-color: #c92a2a;
      color: #c92a2a;
    }

    .quiz-feedback {
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 16px;
      display: none;
    }

    .quiz-feedback.show {
      display: block;
    }

    .quiz-feedback.ok {
      background: #d3f9d8;
      color: #2b8a3e;
    }

    .quiz-feedback.no {
      background: #fff3bf;
      color: #d9480f;
    }

    /* [탭 3] 이야기 순서 맞추기 스타일 */
    .seq-guide {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1d3557;
      margin-bottom: 14px;
    }

    .seq-slots {
      background: #f8f9fa;
      border: 2px dashed #adb5bd;
      border-radius: 16px;
      padding: 14px;
      min-height: 120px;
      margin-bottom: 18px;
    }

    .seq-slot-item {
      background: #e0fbfc;
      border: 2px solid #2ec4b6;
      color: #005f73;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .seq-pool {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .pool-btn {
      text-align: left;
      background: #ffffff;
      border: 2px solid #ced4da;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      color: #2b2d42;
      cursor: pointer;
    }

    .pool-btn:hover {
      background: #fff9db;
      border-color: #ff9f1c;
    }

    .pool-btn.used {
      display: none;
    }

    @media (max-width: 600px) {
      .tabs {
        grid-template-columns: 1fr;
      }
      .en-text {
        font-size: 1.32rem;
      }
      .picture-frame {
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <div>
        <h1>📖 Leo's Yellow Hat (레오의 노란 모자)</h1>
        <p>초등 3학년 영어 이야기 읽기 및 내용 이해 활동</p>
      </div>
      <div class="badge">총 5장면 스토리</div>
    </div>

    <!-- 3단계 탭 -->
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabBtn-0" onclick="switchTab(0)">1. 이야기 읽기</button>
      <button type="button" class="tab-btn" id="tabBtn-1" onclick="switchTab(1)">2. 내용 이해 퀴즈</button>
      <button type="button" class="tab-btn" id="tabBtn-2" onclick="switchTab(2)">3. 순서 맞추기</button>
    </div>

    <!-- [1단계] 이야기 읽기 -->
    <div class="card active" id="tab-0">
      <div class="scene-nav" id="sceneNav"></div>

      <div class="scene-header">
        <span class="scene-tag" id="sceneTag">장면 1 / 5</span>
        <button type="button" class="btn btn-meaning" id="meaningBtn" onclick="toggleMeaning()">💡 우리말 해석 보기</button>
      </div>

      <!-- asset/L1 ~ L5 개별 그림 표시 영역 -->
      <div class="picture-frame" id="pictureFrame"></div>

      <div class="story-box">
        <div class="en-text" id="enText"></div>
        <div class="ko-text" id="koText"></div>
      </div>

      <div class="vocab-list" id="vocabList"></div>

      <div class="action-row">
        <button type="button" class="btn btn-nav" id="prevSceneBtn" onclick="changeScene(-1)">◀ 이전 장면</button>
        <button type="button" class="btn btn-nav" id="nextSceneBtn" onclick="changeScene(1)">다음 장면 ▶</button>
      </div>
    </div>

    <!-- [2단계] 내용 이해 퀴즈 -->
    <div class="card" id="tab-1">
      <div class="quiz-progress" id="quizProgress">문제 1 / 5 (맞힌 개수: 0개)</div>
      <div class="quiz-question" id="quizQuestion"></div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="action-row">
        <button type="button" class="btn btn-meaning" onclick="resetQuiz()">🔄 퀴즈 처음부터</button>
        <button type="button" class="btn btn-nav" id="nextQuizBtn" onclick="nextQuiz()" disabled>다음 문제 ▶</button>
      </div>
    </div>

    <!-- [3단계] 이야기 순서 맞추기 -->
    <div class="card" id="tab-2">
      <div class="seq-guide">이야기의 순서대로 아래 문장 카드를 차례대로 클릭해 보세요!</div>
      <div class="seq-slots" id="seqSlots">
        <div style="color:#868e96; font-size:0.95rem;">여기에 선택한 순서대로 문장이 쌓입니다. (가장 먼저 일어난 일부터 선택하세요)</div>
      </div>
      <div class="quiz-feedback" id="seqFeedback"></div>
      <div class="seq-pool" id="seqPool"></div>
      <div class="action-row">
        <button type="button" class="btn btn-meaning" onclick="initSequenceGame()">🔄 다시 섞기</button>
      </div>
    </div>
  </div>

  <script>
    // 캡처하신 5개의 개별 장면 데이터 (L1.JPG ~ L5.JPG)
    var scenes = [
      {
        baseName: "L1",
        en: "It is a sunny morning. Leo is happy.",
        ko: "화창한 아침이에요. 레오는 행복해요.",
        vocab: [
          { w: "sunny", m: "화창한, 맑은" },
          { w: "morning", m: "아침" },
          { w: "happy", m: "행복한" }
        ]
      },
      {
        baseName: "L2",
        en: "Suddenly, it is windy. Oh no! Leo's hat is flying.",
        ko: "갑자기 바람이 불어요. 오 이런! 레오의 모자가 날아가고 있어요.",
        vocab: [
          { w: "Suddenly", m: "갑자기" },
          { w: "windy", m: "바람이 부는" },
          { w: "flying", m: "날아가는" }
        ]
      },
      {
        baseName: "L3",
        en: "It is rainy now. Leo is under the tree. He is sad.",
        ko: "이제 비가 내려요. 레오는 나무 아래에 있어요. 그는 슬퍼요.",
        vocab: [
          { w: "rainy", m: "비가 오는" },
          { w: "under", m: "~의 아래에" },
          { w: "sad", m: "슬픈" }
        ]
      },
      {
        baseName: "L4",
        en: "The rain stops. It is cloudy. Leo finds his hat.",
        ko: "비가 그쳐요. 날씨가 흐려요. 레오는 그의 모자를 찾아요.",
        vocab: [
          { w: "stops", m: "멈추다, 그치다" },
          { w: "cloudy", m: "흐린" },
          { w: "finds", m: "찾다, 발견하다" }
        ]
      },
      {
        baseName: "L5",
        en: "Leo is happy again. He is at school.",
        ko: "레오는 다시 행복해요. 그는 학교에 있어요.",
        vocab: [
          { w: "happy", m: "행복한" },
          { w: "again", m: "다시" },
          { w: "at school", m: "학교에" }
        ]
      }
    ];

    // 5장면 내용 이해 확인 퀴즈 데이터
    var quizzes = [
      {
        q: "1. 아침 날씨는 어떠했나요? (It is a sunny morning.)",
        options: ["① 비가 내렸다 (rainy)", "② 화창했다 (sunny)", "③ 흐렸다 (cloudy)"],
        answer: 1,
        explain: "정답은 ②번입니다! 'sunny morning'은 화창한 아침이라는 뜻이에요."
      },
      {
        q: "2. 갑자기 바람이 불자 어떤 일이 일어났나요?",
        options: ["① 레오의 가방이 열렸다", "② 레오의 모자가 날아갔다 (Leo's hat is flying)", "③ 레오가 집으로 돌아갔다"],
        answer: 1,
        explain: "정답은 ②번입니다! 바람이 불어서 레오의 노란 모자가 날아갔어요."
      },
      {
        q: "3. 비가 올 때 레오는 어디에 있었나요?",
        options: ["① 나무 아래 (under the tree)", "② 집 안 (in the house)", "③ 벤치 위 (on the bench)"],
        answer: 0,
        explain: "정답은 ①번입니다! 'Leo is under the tree.'는 레오가 나무 아래에 있다는 뜻이에요."
      },
      {
        q: "4. 비가 그친 뒤 레오는 무엇을 찾았나요? (Leo finds his hat.)",
        options: ["① 책가방 (bag)", "② 우산 (umbrella)", "③ 모자 (hat)"],
        answer: 2,
        explain: "정답은 ③번입니다! 비가 그친 뒤 벤치 옆에서 노란 모자(hat)를 찾았어요."
      },
      {
        q: "5. 모자를 다시 찾은 레오는 마지막에 어디에 있나요? (He is at school.)",
        options: ["① 공원 (park)", "② 학교 (school)", "③ 도서관 (library)"],
        answer: 1,
        explain: "정답은 ②번입니다! 'Leo is happy again. He is at school.' 레오는 무사히 학교에 도착했어요."
      }
    ];

    var currentScene = 0;
    var showMeaning = false;
    var currentQuiz = 0;
    var quizScore = 0;
    var quizAnswered = false;
    var selectedSequence = [];
    var shuffledOrder = [];

    // 상단 탭 전환
    function switchTab(tabIndex) {
      for (var i = 0; i < 3; i++) {
        var card = document.getElementById("tab-" + i);
        var btn = document.getElementById("tabBtn-" + i);
        if (i === tabIndex) {
          card.classList.add("active");
          btn.classList.add("active");
        } else {
          card.classList.remove("active");
          btn.classList.remove("active");
        }
      }
    }

    // asset/L1.JPG ~ L5.JPG 이미지를 직접 로드 (확장자 대소문자 및 png/jpg 자동 대응)
    function renderPicture(sceneIndex) {
      var frame = document.getElementById("pictureFrame");
      var base = scenes[sceneIndex].baseName;
      var candidates = [
        "asset/" + base + ".JPG",
        "asset/" + base + ".jpg",
        "asset/" + base + ".png",
        "asset/" + base + ".PNG",
        "asset/" + base + ".jpeg"
      ];
      tryLoadImage(frame, sceneIndex, candidates, 0);
    }

    function tryLoadImage(frame, sceneIndex, list, idx) {
      if (idx >= list.length) {
        var base = scenes[sceneIndex].baseName;
        frame.innerHTML =
          '<div class="error-guide">' +
            '<b>🖼️ asset/' + base + '.JPG 이미지를 불러올 수 없습니다.</b><br>' +
            'HTML 파일과 같은 위치의 <code>asset</code> 폴더 안에<br>' +
            '<code>' + base + '.JPG</code> 파일이 들어 있는지 확인해 주세요.' +
          '</div>';
        return;
      }

      var img = document.createElement("img");
      img.alt = "장면 " + (sceneIndex + 1);
      img.onerror = function () {
        tryLoadImage(frame, sceneIndex, list, idx + 1);
      };
      img.src = list[idx];

      frame.innerHTML = "";
      frame.appendChild(img);
    }

    // [1단계] 이야기 읽기 렌더링
    function renderStory() {
      var navHtml = "";
      for (var i = 0; i < scenes.length; i++) {
        var activeClass = (i === currentScene) ? " active" : "";
        navHtml += '<button type="button" class="scene-num-btn' + activeClass + '" onclick="goScene(' + i + ')">' + (i + 1) + '</button>';
      }
      document.getElementById("sceneNav").innerHTML = navHtml;

      var s = scenes[currentScene];
      document.getElementById("sceneTag").innerHTML = "장면 " + (currentScene + 1) + " / " + scenes.length;

      renderPicture(currentScene);

      document.getElementById("enText").innerHTML = s.en;

      var koEl = document.getElementById("koText");
      koEl.innerHTML = s.ko;
      if (showMeaning) {
        koEl.classList.add("show");
      } else {
        koEl.classList.remove("show");
      }

      var vHtml = "";
      for (var j = 0; j < s.vocab.length; j++) {
        vHtml += '<div class="vocab-item">📘 ' + s.vocab[j].w + ' : ' + s.vocab[j].m + '</div>';
      }
      document.getElementById("vocabList").innerHTML = vHtml;

      document.getElementById("prevSceneBtn").disabled = (currentScene === 0);
      document.getElementById("nextSceneBtn").disabled = (currentScene === scenes.length - 1);
    }

    function goScene(index) {
      currentScene = index;
      renderStory();
    }

    function changeScene(step) {
      var next = currentScene + step;
      if (next >= 0 && next < scenes.length) {
        currentScene = next;
        renderStory();
      }
    }

    function toggleMeaning() {
      showMeaning = !showMeaning;
      var btn = document.getElementById("meaningBtn");
      btn.innerHTML = showMeaning ? "🙈 우리말 해석 숨기기" : "💡 우리말 해석 보기";
      renderStory();
    }

    // [2단계] 내용 이해 퀴즈 렌더링
    function renderQuiz() {
      quizAnswered = false;
      var qData = quizzes[currentQuiz];
      document.getElementById("quizProgress").innerHTML =
        "문제 " + (currentQuiz + 1) + " / " + quizzes.length + " (현재 맞힌 개수: " + quizScore + "개)";
      document.getElementById("quizQuestion").innerHTML = qData.q;

      var optHtml = "";
      for (var i = 0; i < qData.options.length; i++) {
        optHtml += '<button type="button" class="option-btn" id="opt-' + i + '" onclick="checkQuiz(' + i + ')">' + qData.options[i] + '</button>';
      }
      document.getElementById("quizOptions").innerHTML = optHtml;

      var fb = document.getElementById("quizFeedback");
      fb.className = "quiz-feedback";
      fb.innerHTML = "";

      var nextBtn = document.getElementById("nextQuizBtn");
      nextBtn.disabled = true;
      nextBtn.innerHTML = (currentQuiz === quizzes.length - 1) ? "결과 보기 🎉" : "다음 문제 ▶";
    }

    function checkQuiz(choiceIndex) {
      if (quizAnswered) return;
      quizAnswered = true;

      var qData = quizzes[currentQuiz];
      var fb = document.getElementById("quizFeedback");
      var chosenBtn = document.getElementById("opt-" + choiceIndex);
      var correctBtn = document.getElementById("opt-" + qData.answer);

      if (choiceIndex === qData.answer) {
        quizScore++;
        chosenBtn.classList.add("correct");
        fb.className = "quiz-feedback show ok";
        fb.innerHTML = "⭕ " + qData.explain;
      } else {
        chosenBtn.classList.add("wrong");
        correctBtn.classList.add("correct");
        fb.className = "quiz-feedback show no";
        fb.innerHTML = "❌ 아쉬워요! " + qData.explain;
      }

      document.getElementById("quizProgress").innerHTML =
        "문제 " + (currentQuiz + 1) + " / " + quizzes.length + " (현재 맞힌 개수: " + quizScore + "개)";
      document.getElementById("nextQuizBtn").disabled = false;
    }

    function nextQuiz() {
      if (currentQuiz < quizzes.length - 1) {
        currentQuiz++;
        renderQuiz();
      } else {
        document.getElementById("quizQuestion").innerHTML =
          "🎉 퀴즈 완료! 총 " + quizzes.length + "문제 중 " + quizScore + "문제를 맞혔어요!";
        document.getElementById("quizOptions").innerHTML = "";
        var fb = document.getElementById("quizFeedback");
        fb.className = "quiz-feedback show ok";
        fb.innerHTML = "이야기의 내용을 아주 잘 이해했네요! '3. 순서 맞추기' 탭에도 도전해 보세요.";
        document.getElementById("nextQuizBtn").disabled = true;
      }
    }

    function resetQuiz() {
      currentQuiz = 0;
      quizScore = 0;
      renderQuiz();
    }

    // [3단계] 이야기 순서 맞추기 게임 (5장면)
    function initSequenceGame() {
      selectedSequence = [];
      shuffledOrder = [0, 1, 2, 3, 4];

      for (var i = shuffledOrder.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = shuffledOrder[i];
        shuffledOrder[i] = shuffledOrder[j];
        shuffledOrder[j] = temp;
      }

      var fb = document.getElementById("seqFeedback");
      fb.className = "quiz-feedback";
      fb.innerHTML = "";

      renderSequence();
    }

    function renderSequence() {
      var slotsEl = document.getElementById("seqSlots");
      if (selectedSequence.length === 0) {
        slotsEl.innerHTML = '<div style="color:#868e96; font-size:0.95rem;">여기에 선택한 순서대로 문장이 쌓입니다. (가장 먼저 일어난 일부터 선택하세요)</div>';
      } else {
        var slotHtml = "";
        for (var i = 0; i < selectedSequence.length; i++) {
          var sIdx = selectedSequence[i];
          slotHtml += '<div class="seq-slot-item">' + (i + 1) + '번째: ' + scenes[sIdx].en + ' <span style="font-size:0.88rem; color:#495057;">(' + scenes[sIdx].ko + ')</span></div>';
        }
        slotsEl.innerHTML = slotHtml;
      }

      var poolEl = document.getElementById("seqPool");
      var poolHtml = "";
      for (var k = 0; k < shuffledOrder.length; k++) {
        var sceneIdx = shuffledOrder[k];
        var isUsed = (selectedSequence.indexOf(sceneIdx) !== -1);
        var usedClass = isUsed ? " used" : "";
        poolHtml += '<button type="button" class="pool-btn' + usedClass + '" onclick="pickSequence(' + sceneIdx + ')">' + scenes[sceneIdx].en + '</button>';
      }
      poolEl.innerHTML = poolHtml;
    }

    function pickSequence(sceneIdx) {
      var expectedIdx = selectedSequence.length;
      var fb = document.getElementById("seqFeedback");

      if (sceneIdx === expectedIdx) {
        selectedSequence.push(sceneIdx);
        renderSequence();

        if (selectedSequence.length === scenes.length) {
          fb.className = "quiz-feedback show ok";
          fb.innerHTML = "🎉 완벽해요! 레오의 노란 모자 이야기를 처음부터 끝까지 올바른 순서로 모두 맞혔어요!";
        } else {
          fb.className = "quiz-feedback show ok";
          fb.innerHTML = "⭕ 맞았어요! 다음에는 어떤 일이 일어났을까요?";
        }
      } else {
        fb.className = "quiz-feedback show no";
        fb.innerHTML = "❌ 순서가 조금 달라요! '1. 이야기 읽기'에서 순서를 떠올리고 다시 골라보세요.";
      }
    }

    // 초기 화면 구성 실행
    renderStory();
    renderQuiz();
    initSequenceGame();
  </script>
</body>
</html>
